name: chat-relay

on:
  workflow_dispatch:
    inputs:
      id:
        description: '问题 ID（前端生成）'
        required: true
      question:
        description: '访客问题'
        required: true
      lang:
        description: '语言 zh | en'
        required: false
        default: 'zh'

permissions:
  contents: write
  actions: write   # 用于运行结束后自删除

concurrency:
  group: chat-relay
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate answer (NIM)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          QUESTION_ID: ${{ inputs.id }}
          QUESTION: ${{ inputs.question }}
          LANG: ${{ inputs.lang }}
        run: python3 tools/relay_answer.py --out /tmp/answer_payload.json

      - name: Publish answer (single-file orphan branch, overwrite)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q -b answers
          git config user.name "chat-relay"
          git config user.email "chat-relay@users.noreply.github.com"
          cp /tmp/answer_payload.json latest.json
          git add latest.json
          git commit -qm "answer"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" answers

      - name: Self-delete this run (no trace)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || true