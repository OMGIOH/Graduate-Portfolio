name: chat-relay

on:
  workflow_dispatch:
    inputs:
      id:
        description: '问题 ID（前端生成）'
        required: true
      question:
        description: '访客问题'
        required: true
      lang:
        description: '语言 zh | en'
        required: false
        default: 'zh'

permissions:
  contents: write

concurrency:
  group: chat-relay
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate answer (NVIDIA NIM)
        env:
          # ↓ 换供应商/模型时只改这三行；key 放仓库 Secrets（沿用原有 NVIDIA_API_KEY）
          CHAT_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CHAT_BASE_URL: https://integrate.api.nvidia.com/v1
          CHAT_MODELS: nvidia/nemotron-3.5-bolt-e4b
          QUESTION_ID: ${{ inputs.id }}
          QUESTION: ${{ inputs.question }}
          LANG: ${{ inputs.lang }}
        run: python3 tools/relay_answer.py --out /tmp/answer_payload.json

      - name: Publish answer (single-file orphan branch, overwrite)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q -b answers
          git config user.name "chat-relay"
          git config user.email "chat-relay@users.noreply.github.com"
          cp /tmp/answer_payload.json latest.json
          git add latest.json
          git commit -qm "answer"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" answers

      # 运行记录/日志由 chat-cleanup.yml 在本工作流结束后立即删除（运行中的运行不可自删，403）