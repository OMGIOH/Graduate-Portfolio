name: chat-relay

# 作品集 AI 客服中转：由网页调用 GitHub API 点火，在 GitHub 服务器上
# 读知识库 → 向量检索 → 调 NVIDIA NIM 生成回答 → 写入 Job Summary（90 天自动过期，不落仓库文件）
# 前端轮询 Run Summary 拿结果。

on:
  workflow_dispatch:
    inputs:
      id:
        description: '问题 ID（前端生成，用于关联前后端）'
        required: true
      question:
        description: '访客问题'
        required: true
      lang:
        description: '语言 zh | en'
        required: false
        default: 'zh'

permissions:
  contents: read   # 只需读 knowledge.json

concurrency:
  group: chat-relay
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate answer (NIM) and write to Job Summary
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          QUESTION_ID: ${{ inputs.id }}
          QUESTION: ${{ inputs.question }}
          LANG: ${{ inputs.lang }}
        run: python3 tools/relay_answer.py --summary